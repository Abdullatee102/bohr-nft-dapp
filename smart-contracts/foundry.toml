[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.37"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
bohr = "https://rpc.bohr.life"

[etherscan]
bohr = { key = "${BOHR_SCAN_API_KEY}", url = "https://scan.bohr.life/api", chain = 968 }

