  <text x="92" y="132" fill="#b4ffd2" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="8">BOHR NETWORK</text>
  <text x="92" y="1050" fill="#d9ffe6" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" letter-spacing="3">GENESIS</text>
