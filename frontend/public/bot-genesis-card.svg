  <circle cx="600" cy="560" r="194" fill="none" stroke="url(#line)" stroke-width="5"/>
  <circle cx="600" cy="560" r="166" fill="#020706" stroke="#b4ffd2" stroke-opacity=".25" stroke-width="2"/>
  <path d="M500 620V480l100-58 100 58v140l-100 58-100-58Z" fill="#0d5639" stroke="#5ee7a1" stroke-width="6"/>
  <path d="m535 575 65 38 65-38v-63l-65-37-65 37v63Z" fill="#071b16" stroke="#b4ffd2" stroke-width="4"/>
