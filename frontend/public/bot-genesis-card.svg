<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">BOT Genesis NFT</title>
  <desc id="desc">Dark green and black BOT Genesis card graphic</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b16"/>
      <stop offset="0.55" stop-color="#0b3025"/>
      <stop offset="1" stop-color="#020706"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee7a1"/>
      <stop offset="1" stop-color="#0b8f5a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="1200" rx="72" fill="#020706"/>
  <rect x="28" y="28" width="1144" height="1144" rx="52" fill="url(#bg)" stroke="#2bd47d" stroke-opacity=".35" stroke-width="3"/>
  <path d="M72 330h1056M72 870h1056M330 72v1056M870 72v1056" stroke="#69e5a2" stroke-opacity=".08"/>
